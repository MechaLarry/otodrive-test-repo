---
deployment:
  tasks:
    # Deploys the Astro build output to cPanel.
    #
    # Only used if you deploy through cPanel's Git Version Control feature.
    # If you use .github/workflows/deploy.yml (recommended), this file is unused.
    #
    # Run `npm run build` and commit dist/ before pulling, or run the build
    # on the server. dist/ is generated output - it is not hand-edited.
    - export DEPLOYPATH=/home/otodriveafrica/public_html/

    # Astro emits HTML, assets and the sitemap into dist/
    - /bin/cp -R dist/. $DEPLOYPATH

    # Set proper permissions
    - /bin/find $DEPLOYPATH -type f -exec chmod 644 {} \;
    - /bin/find $DEPLOYPATH -type d -exec chmod 755 {} \;

    # Remove WordPress leftovers (if any)
    - /bin/rm -rf $DEPLOYPATH/index.php $DEPLOYPATH/wp-*.php 2>/dev/null || true

    # Note: the booking API (api/) deploys to Render, not cPanel.
